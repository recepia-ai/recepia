services:
  evolution-api-rc2:
    image: evoapicloud/evolution-api:2.4.0-rc2
    container_name: recepia_evolution_api_rc2
    restart: unless-stopped
    depends_on:
      evolution-postgres-rc2:
        condition: service_healthy
      evolution-redis-rc2:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_NAME: recepia-evolution-rc2
      SERVER_URL: http://localhost:8081
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@evolution-postgres-rc2:5432/${POSTGRES_DATABASE}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: recepia_demo_rc2
      CACHE_REDIS_URI: redis://evolution-redis-rc2:6379/0
      CACHE_REDIS_PREFIX_KEY: recepia_rc2
      CONFIG_SESSION_PHONE_CLIENT: Recepia Experimental
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - evolution_instances_rc2:/evolution/instances
    networks:
      - evolution-rc2

  evolution-postgres-rc2:
    image: postgres:15-alpine
    container_name: recepia_evolution_postgres_rc2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - evolution_postgres_rc2:/var/lib/postgresql/data
    networks:
      - evolution-rc2

  evolution-redis-rc2:
    image: redis:7-alpine
    container_name: recepia_evolution_redis_rc2
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - evolution_redis_rc2:/data
    networks:
      - evolution-rc2

volumes:
  evolution_instances_rc2:
  evolution_postgres_rc2:
  evolution_redis_rc2:

networks:
  evolution-rc2:
    name: recepia-evolution-rc2
