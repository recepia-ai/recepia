services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: recepia_evolution_api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution

  evolution-postgres:
    image: postgres:15-alpine
    container_name: recepia_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - evolution

  evolution-redis:
    image: redis:7-alpine
    container_name: recepia_evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - evolution_redis:/data
    networks:
      - evolution

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  evolution:
    name: recepia-evolution
